name: Build Maawa APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.x
          cache: true

      - name: Generate the Android project
        run: |
          flutter create --platforms=android --org com.maawa --project-name maawa .
          rm -rf test

      - name: Adjust Android settings
        run: python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: maawa-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.x
          cache: true

      - name: Generate the web project
        run: |
          flutter create --platforms=web --org com.maawa --project-name maawa .
          rm -rf test

      - name: Get packages
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --no-web-resources-cdn

      - name: Publish the web build to the "web" branch
        run: |
          cd build/web
          git init -b web
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Web build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" web
